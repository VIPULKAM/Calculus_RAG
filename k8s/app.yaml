---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculus-rag-app
  namespace: calculus-rag
  labels:
    app: calculus-rag-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculus-rag-app
  template:
    metadata:
      labels:
        app: calculus-rag-app
    spec:
      initContainers:
        # Wait for PostgreSQL to be ready
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo "Waiting for PostgreSQL..."; sleep 2; done']
        # Wait for Ollama to be ready
        - name: wait-for-ollama
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -q -O- http://ollama-service:11434/api/tags; do echo "Waiting for Ollama..."; sleep 5; done']
      containers:
        - name: app
          image: calculus-rag:latest  # Replace with your registry image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: calculus-rag-config
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: calculus-rag-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: calculus-rag-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: calculus-rag-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: calculus-rag-service
  namespace: calculus-rag
spec:
  selector:
    app: calculus-rag-app
  ports:
    - port: 80
      targetPort: 8501
  type: ClusterIP
