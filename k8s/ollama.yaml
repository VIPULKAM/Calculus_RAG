---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: calculus-rag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # Uncomment and set storageClassName if needed
  # storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: calculus-rag
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "16Gi"
              cpu: "8000m"
              # Uncomment for GPU support (requires NVIDIA device plugin)
              # nvidia.com/gpu: 1
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc
      # Uncomment for GPU node selection
      # nodeSelector:
      #   nvidia.com/gpu: "true"
      # tolerations:
      #   - key: nvidia.com/gpu
      #     operator: Exists
      #     effect: NoSchedule

---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: calculus-rag
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
  type: ClusterIP

---
# Job to pull models after Ollama is ready
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-pull
  namespace: calculus-rag
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-ollama
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -q -O- http://ollama-service:11434/api/tags; do echo "Waiting for Ollama..."; sleep 5; done']
      containers:
        - name: model-puller
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_HOST
              value: "http://ollama-service:11434"
          command:
            - /bin/sh
            - -c
            - |
              echo "Pulling embedding model..."
              ollama pull mxbai-embed-large
              echo "Pulling LLM model..."
              ollama pull qwen2-math:1.5b
              echo "All models pulled successfully!"
